name: RoadsAndTransport
version: ${version}
main: com.tiyler.roadstransport.RoadsAndTransportPlugin
api-version: '26.2'
authors: [Tiyler]
description: Roads, waypoints, homes, physical mail, cargo horses, and caravan trade for civilization servers.
depend: [KingdomsAndCurrency]

commands:
  createwaypoint:
    description: Create a public or personal waypoint.
    usage: /createwaypoint <public <name>|personal>
    permission: roadsandtransport.use
  waypoint:
    description: Manage and inspect waypoints.
    usage: /waypoint <adopt|access|info>
    permission: roadsandtransport.use
  delwaypoint:
    description: Remove the waypoint you are looking at and collect its legitimate refund.
    usage: /delwaypoint
    permission: roadsandtransport.use
  mailbox:
    description: Create or inspect your five-block mail delivery area.
    usage: /mailbox <create <mailbox name>|info>
    permission: roadsandtransport.use
  delmailbox:
    description: Remove your mail delivery area.
    usage: /delmailbox
    permission: roadsandtransport.use
  createmailboxfor:
    description: Create a named mail delivery area for another player at your location.
    usage: /createmailboxfor <player> <mailbox name>
    permission: roadsandtransport.admin
  mail:
    description: Send barrels as physical mail crates or check shipment status.
    usage: /mail <send <player>|rush send <player>|status>
    permission: roadsandtransport.use
  createhome:
    description: Create one of your four named home teleport points.
    usage: /createhome <home name>
    permission: roadsandtransport.use
  horseinfo:
    description: Inspect the horse you are looking at.
    usage: /horseinfo
    permission: roadsandtransport.use
  horsetrust:
    description: Allow a player to use the cargo of the horse you are looking at.
    usage: /horsetrust <player>
    permission: roadsandtransport.use
  horseuntrust:
    description: Remove a player's access to the horse you are looking at.
    usage: /horseuntrust <player>
    permission: roadsandtransport.use
  rat:
    description: RoadsAndTransport administration and help.
    usage: /rat <help|reload|save>
    permission: roadsandtransport.use

permissions:
  roadsandtransport.use:
    default: true
  roadsandtransport.admin:
    default: op
